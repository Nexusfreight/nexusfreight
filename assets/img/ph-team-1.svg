<text x="160.0" y="112.0" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#D53B0D" text-anchor="middle">PHOTO PLACEHOLDER · 320×360</text>
<text x="160.0" y="140.0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#2A2E35" text-anchor="middle">Portrait: account manager</text>
<text x="160.0" y="166.0" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B6F76" text-anchor="middle">Waist-up, at the desk with headset or</text>
